name: Separar fotos e assinaturas dos registros (uso único)

# Copia cada foto/assinatura para a coleção "midias" (conferindo byte a byte) e deixa no registro só a
# referência. Nada é apagado. "verificar" só mostra o que seria feito; "executar" faz e confere.
# Antes de "executar", rode o "Backup do Controle de Peças" (modo completo).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'verificar = só mostra · executar = move e confere'
        type: choice
        options: [verificar, executar]
        default: verificar

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  mover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node backup/mover-midias.mjs --${{ inputs.modo }}
