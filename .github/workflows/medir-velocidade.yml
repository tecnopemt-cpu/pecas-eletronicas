name: Medir velocidade do site

# Mede o tempo de abertura de cada tela no site publicado, com os dados reais,
# simulando celular (4G) e notebook (Wi-Fi). Só lê o banco: gravações são bloqueadas.
on:
  workflow_dispatch:
    inputs:
      rotulo:
        description: 'Nome da medição (ex.: antes / depois)'
        default: 'medição'
      url:
        description: 'Endereço do site'
        default: 'https://tecnopemt-cpu.github.io/pecas-eletronicas/'

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Instalar navegador
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Medir
        run: node desempenho/medir.mjs "${{ inputs.url }}" "${{ inputs.rotulo }}"
      - uses: actions/upload-artifact@v4
        with:
          name: medicao-${{ inputs.rotulo }}
          path: medicao.json
