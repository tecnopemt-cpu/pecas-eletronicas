name: Resumo profissional com IA

# A cada 5 minutos confere se a gestão pediu algum "Resumo profissional com IA" no sistema e, se pediu,
# gera o texto com a IA GRATUITA do GitHub (GitHub Models) a partir dos DADOS DIGITADOS dos cursos — os
# arquivos dos certificados não são lidos nem enviados. Usa o token automático desta rotina (permissão
# "models: read"): não há chave paga nem cadastro extra. O uso gratuito tem limite diário; ao passar dele,
# o GitHub só recusa (não cobra) e o sistema avisa para pedir de novo mais tarde.
# Sem pedido em aberto, termina em segundos. O registro não mostra nomes nem textos (repositório público).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      testar:
        description: 'Só testar se a IA gratuita responde (com um curso de exemplo, sem dados do sistema)'
        type: boolean
        default: false

permissions:
  contents: read
  models: read

concurrency:
  group: resumo-ia
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            backup
            index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gerar os resumos pedidos
        env:
          FIREBASE_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          FIREBASE_SENHA: ${{ secrets.BACKUP_SENHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUMO_IA_MODELO: ${{ vars.RESUMO_IA_MODELO }}
        run: node backup/resumo-ia.mjs ${{ inputs.testar && '--testar' || '' }}
