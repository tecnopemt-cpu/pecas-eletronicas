name: Limpeza para demonstração (Entradas, Orçamentos e Comissão)
# Uso pontual. "verificar" só lista o que seria excluído; "executar" exclui e confere.
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [verificar, executar]
        default: verificar
permissions:
  contents: read
jobs:
  limpeza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node backup/limpeza-demonstracao.mjs --${{ inputs.modo }}
