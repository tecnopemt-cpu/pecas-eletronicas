name: Testar regras do banco

# Roda as regras de seguranca/firestore.rules no emulador oficial do Firestore e confere, caso a caso,
# o que cada tipo de pessoa consegue fazer. Não toca no banco de verdade.
on:
  push:
    branches: [main, 'seguranca-*']
    paths: ['seguranca/**', 'index.html', 'backup/**', '.github/workflows/testar-regras.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar o emulador e as ferramentas de teste
        working-directory: seguranca
        run: npm install --no-audit --no-fund
      - name: Testar as regras
        working-directory: seguranca
        run: npx firebase emulators:exec --only firestore --project demo-controle-pecas "node teste-regras.mjs"
      - name: Instalar o navegador do teste de ponta a ponta
        working-directory: seguranca
        run: npx playwright install --with-deps chromium
      - name: Testar o sistema inteiro com as regras (login, telas, assinatura, backup)
        working-directory: seguranca
        run: npx firebase emulators:exec --only firestore,auth --project demo-controle-pecas "node teste-integracao.mjs"
      - name: Testar a fase 1 (banco ainda aberto: a 1ª entrada cria o acesso novo)
        working-directory: seguranca
        run: npx firebase emulators:exec --config firebase-aberto.json --only firestore,auth --project demo-controle-pecas "node teste-fase1.mjs"
