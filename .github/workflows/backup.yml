name: Backup do Controle de Peças

# Backup automático e externo — funciona fora do sistema (não existe tela de backup no site).
# Todo dia às 23:00 (Brasília): lê o banco do Firebase (Firestore: dados, fotos, assinaturas) e o código,
# cifra com a chave pública (backup/chave-publica.json) e guarda no ramo "backups" deste repositório.
# Opcional: segunda cópia fora do GitHub (Google Drive, OneDrive, S3...) via rclone, se os segredos
# RCLONE_CONFIG e RCLONE_DESTINO estiverem configurados no repositório.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo = backup oficial · teste = teste de recuperação sem gravar nada'
        type: choice
        options: [completo, teste]
        default: completo
  push:
    branches: [main]
    paths: ['backup/**', '.github/workflows/backup.yml']

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODO: ${{ github.event_name == 'push' && 'teste' || inputs.modo || 'completo' }}
      TEM_COPIA_EXTRA: ${{ secrets.RCLONE_CONFIG != '' && secrets.RCLONE_DESTINO != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar backup (banco + fotos + assinaturas + código) e testar a recuperação
        id: gerar
        run: node backup/gerar-backup.mjs --modo "$MODO" --saida saida

      - name: Guardar no ramo "backups" (cópia externa, com retenção)
        if: steps.gerar.outputs.publicar == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir ramo && cd ramo
          git init -q
          git config user.name "backup-automatico"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin backups; then git checkout -q -b atual FETCH_HEAD; fi
          cp ../saida/*.tpbak* .
          node ../backup/retencao.mjs . ../saida/meta.json
          git checkout -q --orphan publicado
          git add -A
          git commit -q -m "Backup ${{ steps.gerar.outputs.arquivo }}"
          git push -q -f origin publicado:backups

      # Cópia diária no Google Drive (ou outro armazenamento do rclone), fora do GitHub.
      # Pasta principal: últimos 30 dias. Subpasta "mensal": o último backup de cada mês, por 13 meses.
      - name: Segunda cópia fora do GitHub (Google Drive via rclone)
        if: steps.gerar.outputs.publicar == 'true' && env.TEM_COPIA_EXTRA == 'true'
        env:
          # (não usar o nome RCLONE_CONFIG aqui: o rclone lê essa variável como caminho do arquivo de configuração)
          CONFIG_RCLONE: ${{ secrets.RCLONE_CONFIG }}
          DESTINO: ${{ secrets.RCLONE_DESTINO }}
          ARQUIVO: ${{ steps.gerar.outputs.arquivo }}
        run: |
          set -e
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$CONFIG_RCLONE" > ~/.config/rclone/rclone.conf
          rclone copy saida/ "$DESTINO" --include "*.tpbak*"
          MES=$(echo "$ARQUIVO" | sed -E 's/^backup-([0-9]{6}).*/\1/')
          for f in saida/*.tpbak*; do
            rclone copyto "$f" "$DESTINO/mensal/$(basename "$f" | sed -E "s/^backup-[0-9]{8}-[0-9]{4}-/backup-$MES-/")"
          done
          rclone delete "$DESTINO" --max-depth 1 --min-age 30d --include "backup-*.tpbak*"
          rclone delete "$DESTINO/mensal" --min-age 400d --include "backup-*.tpbak*"
          echo "Na pasta principal:"; rclone lsl "$DESTINO" --max-depth 1 --include "*.tpbak*" | sort -k2 | tail -3
          echo "::notice::Cópia no armazenamento externo: $ARQUIVO (+ cópia do mês $MES)."

      - name: Remover registros da antiga tela de backup do banco
        if: env.MODO != 'teste'
        continue-on-error: true
        run: node backup/limpar-legado.mjs

      - name: Manter a rotina ativa (o GitHub pausa agendamentos após 60 dias sem atividade)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/enable" -o /dev/null -w "%{http_code}\n"
          curl -sS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/verificar-backup.yml/enable" -o /dev/null -w "%{http_code}\n"

      # Aviso por e-mail: abre (ou atualiza) um "issue" no repositório, com menção à conta da empresa.
      # O GitHub manda e-mail de issues/menções para a conta tecnopemt-cpu — chega mesmo com o site fora do ar.
      - name: Avisar por e-mail se o backup falhar
        if: failure() && env.MODO != 'teste'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node backup/alerta.mjs falha "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Encerrar aviso de falha quando o backup volta a funcionar
        if: success() && env.MODO != 'teste'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node backup/alerta.mjs resolvido "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
