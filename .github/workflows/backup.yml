name: Backup do Controle de Peças

# Backup automático e externo — funciona fora do sistema (não existe tela de backup no site).
# Todo dia às 23:00 (Brasília): lê o banco do Firebase (Firestore: dados, fotos, assinaturas) e o código,
# cifra com a chave pública (backup/chave-publica.json) e guarda no ramo "backups" deste repositório.
# Opcional: segunda cópia fora do GitHub (Google Drive, OneDrive, S3...) via rclone, se os segredos
# RCLONE_CONFIG e RCLONE_DESTINO estiverem configurados no repositório.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo = backup oficial · teste = teste de recuperação sem gravar nada'
        type: choice
        options: [completo, teste]
        default: completo
  push:
    branches: [main]
    paths: ['backup/**', '.github/workflows/backup.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODO: ${{ github.event_name == 'push' && 'teste' || inputs.modo || 'completo' }}
      TEM_COPIA_EXTRA: ${{ secrets.RCLONE_CONFIG != '' && secrets.RCLONE_DESTINO != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar backup (banco + fotos + assinaturas + código) e testar a recuperação
        id: gerar
        run: node backup/gerar-backup.mjs --modo "$MODO" --saida saida

      - name: Guardar no ramo "backups" (cópia externa, com retenção)
        if: steps.gerar.outputs.publicar == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir ramo && cd ramo
          git init -q
          git config user.name "backup-automatico"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin backups; then git checkout -q -b atual FETCH_HEAD; fi
          cp ../saida/*.tpbak* .
          node ../backup/retencao.mjs . ../saida/meta.json
          git checkout -q --orphan publicado
          git add -A
          git commit -q -m "Backup ${{ steps.gerar.outputs.arquivo }}"
          git push -q -f origin publicado:backups

      - name: Segunda cópia fora do GitHub (opcional, rclone)
        if: steps.gerar.outputs.publicar == 'true' && env.TEM_COPIA_EXTRA == 'true'
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_DESTINO: ${{ secrets.RCLONE_DESTINO }}
        run: |
          set -e
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          rclone copy saida/ "$RCLONE_DESTINO" --include "*.tpbak*"
          echo "::notice::Segunda cópia enviada para o armazenamento externo configurado."

      - name: Remover registros da antiga tela de backup do banco
        if: env.MODO != 'teste'
        continue-on-error: true
        run: node backup/limpar-legado.mjs

      - name: Manter a rotina ativa (o GitHub pausa agendamentos após 60 dias sem atividade)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/enable" -o /dev/null -w "%{http_code}\n"
