name: Verificar login do Firebase (produção)
# Confere, sem criar nem alterar nada, se o login por e-mail/senha do projeto real responde para o site.
on:
  push:
    branches: ['seguranca-*']
    paths: ['.github/workflows/verificar-auth.yml']
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Login por e-mail/senha responde (conta inexistente, só para ver a resposta)
        run: |
          KEY=$(echo 'AIzaSyCIHIGfSHmPTMF376-qsLfO5Se2vgGVXho')
          R=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$KEY" \
            -H 'Content-Type: application/json' -H 'Referer: https://tecnopemt-cpu.github.io/pecas-eletronicas/' -H 'Origin: https://tecnopemt-cpu.github.io' \
            -d '{"email":"teste-inexistente-123@acesso.controle-pecas.app","password":"cp1-x","returnSecureToken":true}')
          echo "::notice::Resposta do login: $(echo "$R" | tr -d '\n' | cut -c1-300)"
