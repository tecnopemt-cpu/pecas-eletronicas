<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Controle de Peças - Tecnopemt</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#453B3C" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Peças Tecnopemt" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{
    --dark:#0F2A47;
    --dark-soft:#59494A;
    --painel:#FFFFFF;
    --fundo:#F2EFEE;
    --borda:#E1D9D7;
    --laranja:#E97307;
    --laranja-escuro:#C86206;
    --laranja-bg:#FBEBDB;
    --verde:#2E8B57;
    --verde-bg:#E7F3EC;
    --vermelho:#C0392B;
    --vermelho-bg:#FBEAE8;
    --texto:#453B3C;
    --texto-fraco:#8A7A78;
    --card:#FFFFFF;
    --input-bg:#FFFFFF;
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;overscroll-behavior-y:none;}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;background:var(--input-bg);border:1px solid var(--borda);color:var(--texto);border-radius:8px;padding:11px 12px;font-size:16px;width:100%;transition:border-color .15s ease, box-shadow .15s ease;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--laranja);border-color:var(--laranja);}
  @media (hover:hover){
    input:hover:not(:disabled):not(:focus),select:hover:not(:disabled):not(:focus),textarea:hover:not(:disabled):not(:focus){border-color:#c9bab8;}
  }
  label{font-size:12.5px;color:var(--texto-fraco);display:block;margin-bottom:4px;margin-top:10px;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--texto-fraco);font-weight:600;padding:10px;border-bottom:1px solid var(--borda);white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid var(--borda);vertical-align:middle;}
  tbody tr{transition:background-color .12s ease;}
  @media (hover:hover){ tr:hover td{background:#FAF8F7;} }
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--laranja);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-size:14px;font-weight:700;min-height:42px;transition:background-color .15s ease, box-shadow .15s ease, transform .08s ease;}
  @media (hover:hover){
    .btn:hover:not(:disabled){background:var(--laranja-escuro);box-shadow:0 2px 8px rgba(198,102,15,.28);}
    .btn.secundario:hover:not(:disabled){background:var(--borda);box-shadow:0 1px 4px rgba(69,59,60,.1);}
    .btn.perigo:hover:not(:disabled){background:#f5d4cf;box-shadow:0 1px 4px rgba(192,57,43,.18);}
    .btn.verde:hover:not(:disabled){background:#d9f0e2;box-shadow:0 1px 4px rgba(47,142,87,.18);}
  }
  .btn:active:not(:disabled){transform:translateY(1px);box-shadow:none;}
  .btn.secundario{background:var(--fundo);color:var(--texto);border:1px solid var(--borda);}
  .btn.perigo{background:var(--vermelho-bg);color:var(--vermelho);}
  .btn.verde{background:var(--verde-bg);color:var(--verde);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.pequeno{padding:7px 11px;font-size:12.5px;min-height:34px;}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px;transition:box-shadow .15s ease, border-color .15s ease;}
  .card.clicavel{cursor:pointer;}
  @media (hover:hover){ .card.clicavel:hover{box-shadow:0 4px 14px rgba(69,59,60,.12);border-color:#d8c9c7;} }
  .foto-clicavel{cursor:pointer;transition:opacity .15s ease, box-shadow .15s ease;}
  @media (hover:hover){ .foto-clicavel:hover{opacity:.82;box-shadow:0 0 0 2px rgba(233,115,7,.3);} }
  .linha-clicavel{cursor:pointer;}
  .nome-cliente-clicavel{text-decoration:none;}
  @media (hover:hover){ .nome-cliente-clicavel:hover{text-decoration:underline;color:var(--laranja-escuro);} }
  .avisos-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:20px;align-items:start;}
  @media (max-width:960px){ .avisos-grid{grid-template-columns:1fr;} }
  .btn-menu-pontos{background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:5px 9px;color:var(--texto-fraco);border-radius:6px;transition:background-color .15s ease,color .15s ease;}
  @media (hover:hover){ .btn-menu-pontos:hover{background:var(--fundo);color:var(--texto);} }
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.estoque{background:var(--fundo);color:var(--dark-soft);border:1px solid var(--borda);}
  .badge.conserto{background:var(--laranja-bg);color:var(--laranja-escuro);}
  .badge.consertada{background:var(--verde-bg);color:var(--verde);}
  .badge.entregue{background:var(--verde-bg);color:var(--verde);}
  .badge.pendente{background:var(--laranja-bg);color:var(--laranja-escuro);}
  .badge.aprovado{background:var(--verde-bg);color:var(--verde);}
  .badge.rota{background:#E8F0FB;color:#1E4B84;}
  .badge.recusado{background:var(--vermelho-bg);color:var(--vermelho);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--borda);border-radius:6px;}
  .modal-fundo{position:fixed;inset:0;background:rgba(40,30,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto;}
  .modal{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:22px;width:100%;max-width:560px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--borda);}

  /* ---- App shell: menu lateral (expansível/recolhível no desktop, gaveta no celular) + cabeçalho ---- */
  .app-shell{display:flex;height:100dvh;overflow:hidden;background:var(--fundo);}
  .sidebar{background:var(--dark);color:#fff;width:240px;flex-shrink:0;display:flex;flex-direction:column;transition:width .2s ease;overflow-x:hidden;}
  .sidebar.recolhida{width:68px;}
  .sidebar-topo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .sidebar-topo img{width:30px;height:30px;border-radius:7px;flex-shrink:0;}
  .sidebar-topo .titulo{font-weight:700;font-size:14.5px;line-height:1.2;white-space:nowrap;}
  .sidebar-topo .subtitulo{font-size:11px;color:#9FB0C2;white-space:nowrap;}
  .sidebar.recolhida .sidebar-topo .titulo,
  .sidebar.recolhida .sidebar-topo .subtitulo{display:none;}
  .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;display:flex;flex-direction:column;gap:2px;}
  .sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#C7D2DE;background:none;border:none;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,color .15s ease;width:100%;text-align:left;}
  .sidebar-item .icone{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .sidebar-item .label{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.recolhida .sidebar-item .label{display:none;}
  @media (hover:hover){ .sidebar-item:not(.ativo):hover{background:rgba(255,255,255,.08);color:#fff;} }
  .sidebar-item.ativo{background:var(--laranja);color:#fff;}
  .sidebar-rodape{padding:10px 8px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .sidebar-backdrop{display:none;}

  .topo-novo{flex-shrink:0;background:var(--dark);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;padding-top:max(12px, env(safe-area-inset-top));border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-toggle{background:rgba(255,255,255,.1);border:none;color:#fff;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;transition:background-color .15s ease;}
  @media (hover:hover){ .sidebar-toggle:hover{background:rgba(255,255,255,.2);} }
  .topo-novo-usuario{display:flex;align-items:center;gap:10px;}
  .topo-novo-usuario .nome{font-weight:700;font-size:13.5px;line-height:1.25;}
  .topo-novo-usuario .cargo{font-size:11px;color:#9FB0C2;}

  .conteudo-principal{flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px calc(env(safe-area-inset-bottom) + 20px);}

  /* ---- Telas em modo painel (Orçamento, Cadastro de Peças, Entrada de Peças, Clientes): cabeçalho da tela e da tabela fixos, só as linhas rolam ---- */
  .painel-tela{display:flex;flex-direction:column;height:100%;}
  .painel-cabecalho{flex-shrink:0;}
  .painel-tabela{flex:1;min-height:0;overflow:auto;padding:0;}
  .painel-tabela table{width:100%;}
  .painel-tabela thead th{position:sticky;top:0;background:var(--card);z-index:5;box-shadow:0 1px 0 var(--borda);}

  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;width:260px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:2px 0 20px rgba(0,0,0,.3);}
    .sidebar.mobile-aberta{transform:translateX(0);}
    .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s ease;}
    .sidebar-backdrop.visivel{opacity:1;pointer-events:auto;}
    .topo-novo{padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));}
    .topo-novo-usuario .cargo{display:none;}
    .conteudo-principal{padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);}
  }

  @media (max-width:640px){
    .grid2{grid-template-columns:1fr;}
    h2{font-size:19px;}
    /* modais viram uma folha que sobe do rodapé, mais fácil de usar com o polegar */
    .modal-fundo{align-items:flex-end;padding:0;}
    .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  }

  /* ---- Telas de acesso (Login / Criar conta / Primeiro acesso) ---- */
  .acesso{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);background:#0F2A47;color:#fff;position:relative;overflow:hidden;isolation:isolate;}
  /* Um único fundo contínuo para a tela inteira (sem divisão): placa ao centro, dissolvendo nos dois lados */
  .acesso::before{content:'';position:absolute;inset:0;z-index:-2;background:url(icons/fundo-placa.jpg) 46% center/cover no-repeat;opacity:.62;-webkit-mask-image:radial-gradient(ellipse 55% 85% at 46% 50%,#000 30%,rgba(0,0,0,.55) 62%,transparent 100%);mask-image:radial-gradient(ellipse 55% 85% at 46% 50%,#000 30%,rgba(0,0,0,.55) 62%,transparent 100%);animation:acessoAparece 1.2s ease both;}
  /* Véu no mesmo azul-marinho do menu lateral: mais denso atrás dos textos (esq.) e do formulário (dir.) */
  .acesso::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(11,33,56,.9) 0%,rgba(11,33,56,.74) 26%,rgba(15,42,71,.3) 48%,rgba(15,42,71,.42) 60%,rgba(15,42,71,.8) 78%,rgba(15,42,71,.9) 100%),radial-gradient(ellipse 60% 50% at 50% 0%,rgba(233,115,7,.07),transparent 70%),linear-gradient(180deg,rgba(9,28,48,.35),transparent 25%,transparent 75%,rgba(9,28,48,.45));}
  .acesso-marca{position:relative;}
  .acesso-acento{position:absolute;z-index:3;fill:none;stroke:var(--laranja);stroke-width:2;opacity:.75;pointer-events:none;}
  .acesso-acento-1{top:0;left:0;width:200px;height:200px;}
  .acesso-acento-2{bottom:0;left:0;width:260px;height:260px;opacity:.55;}
  .acesso-acento-3{bottom:0;right:0;width:200px;height:200px;opacity:.45;}
  .acesso-marca-conteudo{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;gap:44px;padding:56px 14% 40px 8%;}
  .acesso-logo{display:flex;align-items:center;gap:16px;}
  .acesso-logo img{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);}
  .acesso-logo-nome{font-size:22px;font-weight:800;letter-spacing:1.5px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .acesso-logo-sub{font-size:13.5px;color:#C7D5E6;letter-spacing:.3px;margin-top:2px;}
  .acesso-titulo{margin:0;font-size:clamp(30px,3.2vw,42px);line-height:1.12;font-weight:800;letter-spacing:-.5px;position:relative;padding-left:20px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.45);}
  .acesso-titulo::before{content:'';position:absolute;left:0;top:.18em;bottom:.18em;width:5px;border-radius:3px;background:var(--laranja);transform:skewX(-12deg);}
  .acesso-titulo span{color:var(--laranja);}
  .acesso-subtitulo{margin:10px 0 0 20px;font-size:17.5px;color:#EAF0F7;text-shadow:0 1px 8px rgba(0,0,0,.45);}
  .acesso-destaques{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px;}
  .acesso-destaques li{display:flex;gap:14px;align-items:flex-start;}
  .acesso-destaque-icone{width:42px;height:42px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#FF8A1F;background:rgba(10,24,42,.75);border:1px solid rgba(233,115,7,.45);box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .acesso-destaques strong{display:block;font-size:16px;margin-bottom:3px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45);}
  .acesso-destaques li div span{font-size:14px;color:#D3DEEB;text-shadow:0 1px 6px rgba(0,0,0,.45);}
  .acesso-rodape{font-size:12.5px;color:#9FB3CB;line-height:1.6;letter-spacing:.2px;}
  .acesso-painel{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:40px 6% 40px 2%;color:var(--texto);}
  .acesso-card{width:100%;max-width:460px;background:#FFFFFF;border-radius:18px;padding:40px 40px 32px;box-shadow:0 30px 70px rgba(4,14,28,.45),0 2px 8px rgba(4,14,28,.2);border:1px solid rgba(255,255,255,.08);}
  .acesso-painel .card{width:100% !important;max-width:460px;border-radius:18px;padding:32px;background:#FFFFFF;box-shadow:0 30px 70px rgba(4,14,28,.45),0 2px 8px rgba(4,14,28,.2);border:1px solid rgba(255,255,255,.08);}
  .acesso-painel .card h2{color:#13253A;}
  .acesso-card-topo{text-align:center;margin-bottom:22px;}
  .acesso-card-logo{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 20px rgba(15,42,71,.25);}
  .acesso-card-topo h2{margin:14px 0 4px;font-size:27px;font-weight:800;color:#0F2A47;letter-spacing:-.3px;}
  .acesso-card-topo p{margin:0;font-size:14.5px;color:#617085;}
  .acesso-rotulo{font-size:13px;color:#3A4A5E;font-weight:600;margin:16px 0 6px;}
  .acesso-campo{position:relative;}
  .acesso-campo-icone{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7D8DA1;display:flex;pointer-events:none;transition:color .15s ease;}
  .acesso-campo input{height:52px;padding:0 14px 0 46px;border-radius:11px;border:1px solid #D8DDE3;background:#F3F5F7;color:#13253A;font-size:16px;transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease;}
  .acesso-campo input::placeholder{color:#8C9AAC;}
  .acesso-campo input:focus{outline:none;border-color:var(--laranja);background:#fff;box-shadow:0 0 0 4px rgba(233,115,7,.16);}
  .acesso-campo:focus-within .acesso-campo-icone{color:var(--laranja);}
  .acesso-campo input[type=password],.acesso-campo input#acesso-senha{padding-right:52px;}
  .acesso-ver-senha{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;background:none;border-radius:9px;color:#5F6F84;display:flex;align-items:center;justify-content:center;transition:background-color .15s ease,color .15s ease;}
  .acesso-ver-senha:focus-visible{outline:2px solid var(--laranja);}
  .acesso-erro{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 13px;border-radius:10px;background:var(--vermelho-bg);border:1px solid #F1C4BE;color:#A5311F;font-size:13.5px;line-height:1.4;animation:acessoTremor .35s ease;}
  .acesso-erro svg{flex-shrink:0;margin-top:1px;}
  .acesso-btn-entrar{margin-top:22px;width:100%;height:54px;border:none;border-radius:11px;background:linear-gradient(180deg,#F07C12,#E36C02);color:#fff;font-size:16.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 18px rgba(233,115,7,.32);transition:transform .12s ease,box-shadow .15s ease,filter .15s ease;}
  .acesso-btn-entrar svg{transition:transform .18s ease;}
  .acesso-btn-entrar:active:not(:disabled){transform:translateY(1px) scale(.99);box-shadow:0 3px 8px rgba(233,115,7,.3);}
  .acesso-btn-entrar:disabled{opacity:.75;cursor:progress;}
  .acesso-btn-entrar:focus-visible,.acesso-btn-sec:focus-visible{outline:3px solid rgba(233,115,7,.45);outline-offset:2px;}
  .acesso-btn-sec{margin-top:12px;width:100%;min-height:48px;padding:8px 12px;border-radius:11px;border:1px solid #DCE1E7;background:#F3F5F7;color:#0F2A47;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease;}
  .acesso-btn-sec svg{color:#51637A;flex-shrink:0;}
  .acesso-btn-sec:active{background:#E8ECF0;}
  .acesso-spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:acessoGiro .7s linear infinite;}
  @media (hover:hover){
    .acesso-ver-senha:hover{background:#E6EAEE;color:#13253A;}
    .acesso-campo input:hover:not(:focus){border-color:#BCC4CE;}
    .acesso-btn-entrar:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 12px 24px rgba(233,115,7,.4);transform:translateY(-1px);}
    .acesso-btn-entrar:hover:not(:disabled) svg{transform:translateX(3px);}
    .acesso-btn-sec:hover{background:#fff;border-color:#F0B98A;box-shadow:0 2px 8px rgba(15,42,71,.08);}
  }
  @keyframes acessoGiro{to{transform:rotate(360deg);}}
  @keyframes acessoTremor{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  @keyframes acessoSobe{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes acessoAparece{from{opacity:0;}}
  .acesso-card,.acesso-painel .card{animation:acessoSobe .5s cubic-bezier(.2,.7,.2,1) both;}
  .acesso-marca-conteudo>*{animation:acessoSobe .55s cubic-bezier(.2,.7,.2,1) both;}
  .acesso-marca-conteudo>*:nth-child(2){animation-delay:.07s;}
  .acesso-marca-conteudo>*:nth-child(3){animation-delay:.14s;}
  @media (prefers-reduced-motion:reduce){ .acesso *{animation:none !important;transition:none !important;} }
  /* Notebook com pouca altura */
  @media (max-height:720px) and (min-width:901px){
    .acesso-marca-conteudo{gap:28px;padding-top:36px;padding-bottom:28px;}
    .acesso-card{padding:28px 34px 24px;}
    .acesso-card-topo{margin-bottom:12px;}
    .acesso-card-logo{width:58px;height:58px;}
  }
  /* Celular / tablet em pé: uma coluna, marca compacta no topo */
  @media (max-width:900px){
    .acesso{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .acesso-marca{clip-path:none;}
    .acesso::after{background:linear-gradient(180deg,rgba(11,33,56,.55),rgba(15,42,71,.88) 22%,rgba(15,42,71,.94));}
    .acesso::before{background-position:50% top;background-size:auto 60%;opacity:.5;}
    .acesso-marca-conteudo{padding:22px 20px 18px;gap:0;flex-direction:row;align-items:center;justify-content:center;}
    .acesso-marca-conteudo>*:not(.acesso-logo){display:none;}
    .acesso-logo img{width:44px;height:44px;border-radius:12px;}
    .acesso-logo-nome{font-size:18px;}
    .acesso-logo-sub{font-size:12px;}
    .acesso-painel{align-items:center;padding:4px 16px 24px;}
    .acesso-acento-1,.acesso-acento-3{width:110px;height:110px;}
    .acesso-acento-2{display:none;}
    .acesso-card{padding:26px 20px 22px;border-radius:16px;max-width:520px;}
    .acesso-painel .card{padding:22px 18px;}
    .acesso-card-topo{margin-bottom:10px;}
    .acesso-card-logo{display:none;}
    .acesso-card-topo h2{margin-top:0;font-size:24px;}
    .acesso-card-topo p{font-size:14px;}
    .acesso-rotulo{margin-top:14px;}
  }

  /* ---- Período de Apuração (modal) ---- */
  .modal-fundo:has(.modal-apuracao){background:rgba(12,24,40,.55);backdrop-filter:blur(1.5px);}
  .modal-apuracao{position:relative;max-width:1180px !important;width:100%;padding:28px 30px 22px;border-radius:18px;border:1px solid rgba(15,42,71,.08);background:rgba(255,255,255,.97);box-shadow:0 30px 80px rgba(8,20,36,.35),0 4px 14px rgba(8,20,36,.12);color:#2B3445;isolation:isolate;overflow:hidden;max-height:calc(100dvh - 60px);overflow-y:auto;}
  /* Marca-d'água: plataforma elevatória da identidade TECNOPEMT, ~93% transparente, atrás de tudo */
  .modal-apuracao::before{content:'';position:absolute;z-index:-1;right:-40px;top:70px;width:min(62%,640px);aspect-ratio:912/840;background:url(icons/marca-plataforma.png) right top/contain no-repeat;opacity:.07;pointer-events:none;}
  .apu-fechar-x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:#0F2A47;display:flex;align-items:center;justify-content:center;transition:background-color .15s ease;}
  .apu-fechar-x:hover{background:#EEF2F6;}
  .apu-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;padding-right:46px;}
  .apu-titulo{margin:0;font-size:26px;font-weight:800;color:#0F2A47;display:flex;align-items:center;gap:12px;letter-spacing:-.3px;}
  .apu-titulo-icone{color:var(--laranja);display:flex;}
  .apu-acoes{display:flex;gap:10px;flex-wrap:wrap;}
  .apu-btn-principal{gap:8px;box-shadow:0 6px 16px rgba(233,115,7,.28);}
  .apu-btn-claro{gap:8px;background:#fff !important;border:1px solid #D7DEE6 !important;color:#0F2A47 !important;font-weight:700;}
  .apu-btn-claro:hover:not(:disabled){background:#F4F7FA !important;border-color:#B9C5D2 !important;}
  .apu-periodo{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
  .apu-periodo label{color:#0F2A47;font-size:13px;}
  .apu-periodo input[type=date]{border-color:#CED7E1;color:#0F2A47;font-weight:600;min-width:190px;}
  .apu-periodo-info{font-size:13.5px;color:#3A4658;display:flex;flex-direction:column;gap:6px;}
  .apu-periodo-info strong{color:#0F2A47;}
  .apu-status{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-right:10px;}
  .apu-status.aberto{background:#FFF4E5;color:#B45309;}
  .apu-status.aviso{background:#FFF4E5;color:#B45309;}
  .apu-status.ok{background:var(--verde-bg);color:var(--verde);}
  .apu-regras-versao{font-size:12.5px;color:#5B6778;}
  .apu-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:18px 0 14px;}
  .apu-card{background:#fff;border:1px solid #DCE3EA;border-radius:12px;padding:14px 14px 13px;box-shadow:0 1px 3px rgba(15,42,71,.05);min-width:0;}
  .apu-card-icone{display:flex;margin-bottom:10px;}
  .apu-card-icone.azul{color:#1E5AA8;} .apu-card-icone.verde{color:#12948A;} .apu-card-icone.vermelho{color:#D93A33;} .apu-card-icone.escuro{color:#0F2A47;}
  .apu-card-rotulo{font-size:13px;color:#1F2B3D;font-weight:600;line-height:1.25;}
  .apu-card-rotulo small{font-size:10.5px;color:#5B6778;font-weight:500;}
  .apu-card-valor{font-size:clamp(18px,1.9vw,24px);font-weight:800;color:#0F2A47;margin-top:6px;line-height:1.15;word-break:break-word;}
  .apu-card-valor.final{color:var(--laranja);}
  .apu-card-valor.alerta{color:#E0531F;}
  .apu-card-sub{font-size:13px;color:#4A5568;font-weight:600;margin-top:4px;}
  .apu-card-sub.alerta{color:#C2410C;}
  .apu-alerta{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:#FFF4E5;border:1px solid #F9D2A4;color:#9A3412;font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .apu-alerta svg{color:#EA7A0C;flex-shrink:0;}
  .apu-alerta.laranja{background:#FFF8EC;}
  .apu-secao{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-size:17px;font-weight:800;color:#0F2A47;}
  .apu-tabela-wrap{border:1px solid #DCE3EA;border-radius:12px;overflow-x:auto;background:rgba(255,255,255,.9);}
  .apu-tabela{font-size:13.5px;min-width:860px;}
  .apu-tabela th{background:#F4F7FA;color:#0F2A47;font-weight:700;font-size:12.5px;padding:12px 12px;border-bottom:1px solid #DCE3EA;border-right:1px solid #E6EBF0;white-space:normal;vertical-align:middle;line-height:1.25;}
  .apu-tabela th:last-child{border-right:none;}
  .apu-tabela th small{display:block;font-weight:500;color:#5B6778;font-size:11px;}
  .apu-tabela td{padding:12px 12px;border-right:1px solid #EEF1F4;color:#2B3445;vertical-align:middle;background:transparent;}
  .apu-tabela td:last-child{border-right:none;}
  .apu-tabela td strong{color:#0F2A47;}
  .apu-tabela tbody tr:hover td{background:rgba(244,247,250,.7);}
  .apu-memoria td{background:#FBFCFD !important;}
  .apu-nome{background:none;border:none;padding:0;font-weight:800;color:#0F2A47;font-size:14px;text-align:left;cursor:pointer;}
  .apu-nome:hover{color:var(--laranja-escuro);}
  .apu-mini{font-size:11.5px;color:#5B6778;margin-top:3px;}
  .apu-mini.link{cursor:pointer;}
  .apu-mini.link:hover{color:var(--laranja-escuro);}
  .apu-neg{color:#B42318;font-weight:700;} .apu-pos{color:var(--verde);font-weight:700;}
  .apu-acoes-linha{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .apu-acoes-linha button{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:7px;border:1px solid #D7DEE6;background:#fff;color:#0F2A47;}
  .apu-acoes-linha button:hover{border-color:var(--laranja);color:var(--laranja-escuro);}
  .apu-selo{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid #D7DEE6;background:#F4F7FA;color:#3A4658;white-space:nowrap;}
  .apu-selo.ok{background:var(--verde-bg);border-color:#BFE3CD;color:var(--verde);}
  .apu-selo.aviso{background:#FFF4E5;border-color:#F9D2A4;color:#B45309;}
  .apu-selo.clicavel{cursor:pointer;}
  .apu-vazio{text-align:center;color:#5B6778;padding:22px !important;}
  .apu-info{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:13px;color:#2F4A6D;line-height:1.5;}
  .apu-info svg{color:#1E5AA8;flex-shrink:0;margin-top:1px;}
  /* Rodapé sempre visível: se o conteúdo rolar, os botões ficam presos na base do modal */
  .apu-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px -30px -22px;padding:14px 30px 18px;position:sticky;bottom:-22px;z-index:3;background:rgba(255,255,255,.96);border-top:1px solid #E6EBF0;backdrop-filter:blur(4px);}
  .apu-rodape-esq{display:flex;gap:10px;flex-wrap:wrap;}
  @media (max-width:1100px){ .apu-cards{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:640px){
    .modal-apuracao{padding:20px 14px 16px;border-radius:14px;max-height:calc(100dvh - 24px);}
    .apu-titulo{font-size:21px;}
    .apu-topo{padding-right:40px;}
    .apu-acoes{width:100%;}
    .apu-acoes .btn{flex:1 1 100%;}
    .apu-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .apu-periodo input[type=date]{min-width:0;}
    .apu-rodape{margin:14px -14px -16px;padding:12px 14px 14px;bottom:-16px;}
    .modal-apuracao::before{width:90%;top:auto;bottom:40px;}
  }

  /* ---- Galeria de fotos (todo o sistema) ---- */
  .galeria{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:#0A1524;color:#fff;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;animation:galeriaAbre .16s ease-out;}
  @keyframes galeriaAbre{from{opacity:0}}
  .galeria-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));flex-shrink:0;}
  .galeria-contador{font-size:15px;color:#E6ECF3;white-space:nowrap;}
  .galeria-contador strong{color:#fff;font-size:17px;}
  .galeria-ferramentas{display:flex;align-items:center;gap:6px;}
  .galeria-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;padding:0;transition:background .15s ease;}
  .galeria-btn:hover:not(:disabled){background:rgba(255,255,255,.2);}
  .galeria-btn:disabled{opacity:.38;cursor:default;}
  .galeria-btn.galeria-fechar{background:var(--laranja);border-color:var(--laranja);margin-left:6px;}
  .galeria-btn.galeria-fechar:hover{background:var(--laranja-escuro);}
  .galeria-zoom-valor{min-width:46px;text-align:center;font-size:13px;font-weight:700;color:#E6ECF3;font-variant-numeric:tabular-nums;}
  .galeria-palco{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:default;}
  .galeria-imagem{width:100%;height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none;}
  .galeria-palco.ampliada .galeria-imagem:active{cursor:grabbing !important;}
  .galeria-imagem.entra-dir{animation:galeriaEntraDir .22s ease-out;}
  .galeria-imagem.entra-esq{animation:galeriaEntraEsq .22s ease-out;}
  @keyframes galeriaEntraDir{from{opacity:.2;translate:48px 0}}
  @keyframes galeriaEntraEsq{from{opacity:.2;translate:-48px 0}}
  .galeria-seta{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(15,42,71,.72);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2;transition:background .15s ease;}
  .galeria-seta:hover{background:var(--laranja);border-color:var(--laranja);}
  .galeria-seta.esq{left:16px;}
  .galeria-seta.dir{right:16px;}
  .galeria-rodape{flex-shrink:0;padding:8px 14px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;}
  .galeria-legenda{font-size:13.5px;color:#E6ECF3;text-align:center;max-width:720px;}
  .galeria-miniaturas{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:3px;scrollbar-width:thin;touch-action:pan-x;}
  .galeria-mini{flex-shrink:0;width:58px;height:58px;padding:0;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#1B2C42;cursor:pointer;opacity:.6;transition:opacity .15s ease,border-color .15s ease;}
  .galeria-mini img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .galeria-mini.atual{border-color:var(--laranja);opacity:1;}
  .galeria-mini:hover{opacity:1;}
  .galeria-dica{font-size:11.5px;color:#A9B6C6;text-align:center;}
  @media (max-width:640px){
    .galeria-topo{padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));}
    .galeria-btn{width:40px;height:40px;border-radius:11px;}
    .galeria-ferramentas{gap:4px;}
    .galeria-zoom-valor{min-width:40px;font-size:12px;}
    .galeria-seta{width:42px;height:42px;background:rgba(15,42,71,.55);}
    .galeria-seta.esq{left:6px;}
    .galeria-seta.dir{right:6px;}
    .galeria-mini{width:48px;height:48px;}
    .galeria-rodape{padding:6px 10px 10px;}
  }
  @media (max-width:360px){ .galeria-zoom-valor{display:none;} }
  /* miniatura com contador de fotos */
  .mini-fotos{position:relative;display:inline-block;line-height:0;vertical-align:middle;}
  .mini-fotos-qtd{position:absolute;right:-5px;bottom:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--laranja);color:#fff;font-size:11px;font-weight:700;line-height:20px;text-align:center;border:2px solid #fff;pointer-events:none;}
  /* ---- Comissão: períodos de apuração ---- */
  .sub-abas{display:inline-flex;gap:4px;padding:4px;margin-bottom:16px;background:#EEF2F6;border-radius:12px;max-width:100%;overflow-x:auto;}
  .sub-abas button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:700;color:#4A5568;cursor:pointer;white-space:nowrap;}
  .sub-abas button.ativa{background:#fff;color:#0F2A47;box-shadow:0 1px 3px rgba(15,42,71,.12);}
  .per-status{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;vertical-align:middle;}
  .per-status.futuro{background:#EEF3FA;border-color:#C9D7EA;color:#1E4B84;}
  .per-status.atual{background:#FFF1E3;border-color:#F6C38E;color:#B45309;}
  .per-status.encerrado{background:#FFF8DB;border-color:#EBD27A;color:#7A5B00;}
  .per-status.fechado{background:#E7F6EC;border-color:#BFE3CD;color:#1E7A45;}
  .per-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px;}
  .per-resumo-card{border-left:4px solid #C9D7EA;margin:0;}
  .per-resumo-card.atual{border-left-color:var(--laranja);}
  .per-resumo-card.pendente{border-left-color:#EBD27A;}
  .per-resumo-card.vencido{border-left-color:var(--vermelho);}
  .per-resumo-rotulo{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#5B6778;}
  .per-resumo-nome{font-size:20px;font-weight:800;color:#0F2A47;margin-top:2px;}
  .per-resumo-datas{font-size:14px;font-weight:600;color:#2F3B4C;}
  .per-resumo-sub{font-size:12.5px;color:#4A5568;margin:6px 0 8px;line-height:1.5;}
  .per-prazo{font-size:13px;font-weight:700;color:#7A5B00;margin-bottom:8px;}
  .per-prazo.vencido{color:var(--vermelho);}
  .per-alerta{font-size:12.5px;line-height:1.5;border-radius:10px;padding:9px 12px;margin:8px 0;}
  .per-alerta.vermelho{background:#FDECEC;color:#9B1C1C;border:1px solid #F5C2C2;}
  .per-alerta.laranja{background:#FFF4E5;color:#8A4B06;border:1px solid #F9D2A4;}
  .per-cabecalho{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:16px 16px 12px;border-bottom:1px solid var(--borda);}
  .per-botoes{display:flex;gap:8px;flex-wrap:wrap;}
  .per-tabela td{vertical-align:middle;}
  .per-linha-atual td{background:#FFF8F0;}
  .per-tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:#5B6778;background:#EEF2F6;border-radius:6px;padding:1px 6px;vertical-align:middle;}
  .per-mini{font-size:12px;color:#4A5568;line-height:1.45;}
  .per-mini.laranja{color:#8A4B06;font-weight:600;}
  .per-mini.vermelho{color:var(--vermelho);font-weight:700;}
  .per-acoes{white-space:nowrap;}
  .per-acoes .btn{margin:2px 0 2px 4px;}
  .per-ver-todos{display:block;width:100%;border:none;border-bottom:1px solid var(--borda);background:#F7F9FB;padding:9px;font-size:12.5px;font-weight:700;color:#1E4B84;cursor:pointer;}
  .per-info{font-size:12.5px;line-height:1.5;color:#2F4A6D;background:#F1F6FC;border:1px solid #D6E3F3;border-radius:10px;padding:9px 12px;margin:8px 0 10px;}
  .per-check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;margin-top:10px;line-height:1.45;}
  .per-check input{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
  .per-link{border:none;background:none;color:#1E4B84;font-size:12px;padding:4px 0;cursor:pointer;text-decoration:underline;}
  .per-previa{max-height:300px;overflow:auto;border:1px solid var(--borda);border-radius:10px;margin-top:10px;}
  .per-feriados{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px;max-height:220px;overflow:auto;}
  .per-feriado{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:#F7F9FB;border-radius:8px;}
  .per-feriado-novo{display:grid;grid-template-columns:160px 1fr auto;gap:8px;align-items:center;}
  .per-prazo-linha{font-size:12.5px;line-height:1.5;color:#7A5B00;background:#FFF8DB;border:1px solid #EBD27A;border-radius:10px;padding:8px 12px;margin:0 0 12px;}
  .per-prazo-linha.vencido{color:#9B1C1C;background:#FDECEC;border-color:#F5C2C2;}
  .per-prazo-linha.neutro{color:#2F4A6D;background:#F1F6FC;border-color:#D6E3F3;}
  .per-vencido{color:var(--vermelho);font-weight:700;}
  .apu-periodo-info .per-prazo-linha{margin:6px 0 0;}
  .sp-lista{display:flex;flex-direction:column;min-width:230px;}
  .sp-lista select{min-width:230px;}
  @media (max-width:760px){
    .per-resumo{grid-template-columns:1fr;}
    .per-botoes{width:100%;display:grid;grid-template-columns:1fr;}
    .per-botoes .btn{width:100%;justify-content:center;min-height:44px;}
    .per-acoes{white-space:normal;display:flex !important;gap:8px;flex-wrap:wrap;}
    .per-acoes .btn{flex:1 1 120px;margin:0;min-height:42px;}
    .per-feriado-novo{grid-template-columns:1fr;}
    .seletor-periodo .sp-lista{grid-column:1 / -1;order:0;min-width:0;}
    .seletor-periodo .sp-lista select{min-width:0;width:100%;}
    .per-linha-atual td{background:transparent;}
    .per-tabela tr.per-linha-atual{border-color:var(--laranja);box-shadow:0 0 0 1px var(--laranja);}
  }
  /* ---- Kanban de orçamentos: ordem dos cartões (arrastar e soltar) ---- */
  .kanban-cartao{-webkit-touch-callout:none;}
  .kanban-cartao.kanban-arrastando{transform:rotate(1.2deg) scale(1.02);box-shadow:0 16px 34px rgba(15,42,71,.28) !important;outline:2px solid var(--laranja);cursor:grabbing;opacity:.97;}
  .kanban-marcador{flex-shrink:0;border:2px dashed var(--laranja);border-radius:10px;background:rgba(233,115,7,.08);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--laranja-escuro);animation:kanbanMarcador .15s ease-out;}
  @keyframes kanbanMarcador{from{opacity:.3;transform:scaleY(.85)}}
  body.kanban-arrastando-ativo,body.kanban-arrastando-ativo *{-webkit-user-select:none !important;user-select:none !important;cursor:grabbing !important;}
  @media (hover:hover) and (pointer:fine){ .kanban-cartao:active{cursor:grab;} }
  .kanban-posicao{margin-top:14px;padding:12px;border:1px solid var(--borda);border-radius:10px;background:var(--fundo);}
  .kanban-posicao-titulo{font-size:13px;margin-bottom:8px;}
  .kanban-posicao-botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .kanban-posicao-botoes .btn{justify-content:center;min-height:38px;}
  .kanban-posicao-exata{display:grid;grid-template-columns:1fr 80px auto;gap:6px;align-items:center;margin-top:8px;}

const {

// ======================= FIREBASE =======================

// ======================= HELPERS =======================
function formatMoeda(v) {
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
}
function formatCNPJ(v) {
  const d = (v || '').replace(/\D/g, '');
  if (d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, '$1.$2.$3/$4-$5');
  if (d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
  return d;
}
function formatData(v) {
  if (!v) return '-';
  const d = v.toDate ? v.toDate() : new Date(v);
  return d.toLocaleDateString('pt-BR');
}
async function hashSenha(senha) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(senha));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function resizeImagem(file, maxW = 900, qualidade = 0.62) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width,
          h = img.height;
        if (w > maxW) {
          h = Math.round(h * (maxW / w));
          w = maxW;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const SENHA_MASTER = '0538';
function confirmarSenhaMaster(mensagem) {
  const senha = prompt(mensagem || 'Digite a senha master para confirmar:');
  if (senha === null) return false;
  if (senha !== SENHA_MASTER) {
    alert('Senha master incorreta.');
    return false;
  }
  return true;
}

// ======================= PERFIS E PERMISSÕES =======================
const MODULOS_PERMISSAO = ['dashboard', 'lotes', 'catalogo', 'clientes', 'orcamentos', 'comissoes', 'funcionarios'];
const NOME_MODULO = {
  dashboard: 'Painel',
  lotes: 'Entrada de Peças',
  catalogo: 'Cadastro de Peças',
  clientes: 'Clientes',
  orcamentos: 'Orçamentos',
  comissoes: 'Comissão',
  funcionarios: 'Equipe'
};
function nivelAcesso(usuario, modulo) {
  if (!usuario) return 'sem_acesso';
  if (usuario.perfil === 'master') return 'editar';
  // usuário legado (cadastrado antes desse sistema de permissões) sem o campo definido:
  // não restringe, pra não trancar ninguém que já usava o sistema livremente.
  if (!usuario.permissoes) return 'editar';
  return usuario.permissoes[modulo] || 'sem_acesso';
}
function podeVisualizar(usuario, modulo) {
  return nivelAcesso(usuario, modulo) !== 'sem_acesso';
}
function podeEditar(usuario, modulo) {
  return nivelAcesso(usuario, modulo) === 'editar';
}
function colunaPermitida(usuario, coluna) {
  if (!usuario) return false;
  if (usuario.perfil === 'master') return true;
  if (!usuario.colunasOrcamento) return true; // sem restrição configurada = todas liberadas
  if (usuario.colunasOrcamento.includes(coluna)) return true;
  // permissão salva com o nome antigo "Entregue/Faturado" vale para Rota e Concluído
  return (coluna === 'Rota' || coluna === 'Concluído') && usuario.colunasOrcamento.includes('Entregue/Faturado');
}
function comissaoEscopoDe(usuario) {
  if (!usuario) return 'propria';
  if (usuario.perfil === 'master') return 'administrar';
  return usuario.comissaoEscopo || 'administrar'; // legado sem campo: mantém a visão total que já tinha
}
function ehMaster(usuario) {
  return usuario?.perfil === 'master';
}
function ehAdministrador(usuario) {
  return usuario?.perfil === 'administrador' || usuario?.perfil === 'master';
}
// Quem pode administrar (bloquear/desbloquear/inativar/redefinir senha/editar permissões/editar dados) de outra conta:
// o Master pode gerenciar qualquer um (menos ele mesmo por essas ações — dados pessoais são exceção à parte);
// um Administrador só gerencia contas de perfil "funcionario" (nunca outro admin, nunca o Master).
function podeGerenciarFuncionario(usuarioLogado, alvo) {
  if (!usuarioLogado || !alvo) return false;
  if (alvo.perfil === 'master') return false;
  if (ehMaster(usuarioLogado)) return true;
  if (ehAdministrador(usuarioLogado) && alvo.perfil !== 'administrador') return true;
  return false;
}
async function buscarEnderecoPorCep(cep) {
  const numeros = (cep || '').replace(/\D/g, '');
  if (numeros.length !== 8) return null;
  try {
    const resp = await fetch(`https://viacep.com.br/ws/${numeros}/json/`);
    const d = await resp.json();
    if (d.erro) return null;
    return {
      endereco: d.logradouro || '',
      bairro: d.bairro || '',
      cidade: d.localidade || '',
      uf: d.uf || ''
    };
  } catch (err) {
    return null;
  }
}
function statusRotulo(status) {
  return {
    ativo: '🟢 Ativo',

}
function gerarSenhaTemporaria() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
async function registrarHistorico(funcionarioId, texto) {
  await db.collection('funcionarios').doc(funcionarioId).update({
    historico: firebase.firestore.FieldValue.arrayUnion({
      data: new Date().toISOString(),
      texto
    })
  });
}
// Lançamentos de comissão de um orçamento: valor × % da ficha (Equipe) VIGENTE na data de
// referência. Funcionário desligado não recebe lançamento novo; quem já tinha lançamento
// neste orçamento (idsPreservar) mantém — o histórico dele é preservado.
function calcularComissoesOrcamento(total, funcionarios, dataRef, idsPreservar) {
  dataRef = dataRef || new Date();
  idsPreservar = idsPreservar || [];
  const participa = f => funcionarioAtivoEm(f, dataRef) || idsPreservar.includes(f.id);
  const cache = {};
  function valorDe(func, visitados) {
    if (!func) return 0;
    if (cache[func.id] !== undefined) return cache[func.id];
    if (visitados.has(func.id)) return 0; // evita loop de referência
    visitados.add(func.id);
    const percentual = percentualVigente(func, dataRef);
    let base;
    if (func.comissaoBaseId) {
      const funcBase = funcionarios.find(fu => fu.id === func.comissaoBaseId);
      base = valorDe(funcBase, visitados);
    } else {
      base = total;
    }
    const valor = base * percentual / 100;
    cache[func.id] = valor;
    return valor;
  }
  return funcionarios.filter(f => participa(f) && percentualVigente(f, dataRef) > 0).map(f => ({
    funcionarioId: f.id,
    valor: valorDe(f, new Set()),
    percentual: percentualVigente(f, dataRef)
  })).filter(c => c.valor > 0);
}
function loteTotalmenteClassificado(itens) {
  return (itens || []).every(it => it.quantidade === (it.qtdConsertada || 0) + (it.qtdGarantia || 0) + (it.qtdTeste || 0) + (it.qtdNaoConsertada || 0));
}
// Elegibilidade de comissão: uma peça em Teste só libera comissão quando o teste
// for confirmado como aprovado; se for reprovado, nunca gera comissão (mesmo que

// ======================= CPF / ASSINATURA / PDF =======================
function validarCPF(cpf) {
  const d = (cpf || '').replace(/\D/g, '');
  if (d.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(d)) return false;
  let soma = 0;
  for (let i = 0; i < 9; i++) soma += Number(d[i]) * (10 - i);
  let resto = soma * 10 % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== Number(d[9])) return false;
  soma = 0;
  for (let i = 0; i < 10; i++) soma += Number(d[i]) * (11 - i);
  resto = soma * 10 % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== Number(d[10])) return false;
  return true;
}
function formatarCPF(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 11);
  return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
}
function gerarCodigoAssinatura() {

}
function linkAssinatura(tipo, id) {

}
function carregarImagemDataUrl(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      try {
        resolve(canvas.toDataURL('image/png'));
      } catch (err) {
        reject(err);
      }
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function coletarLocalizacao() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => resolve({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude
    }), () => resolve(null), {
      timeout: 12000
    });
  });
}
async function coletarIp() {

    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    return d.ip || '';
  } catch (err) {

}

  doc.setFontSize(8.5);
  doc.setTextColor(120);
  const linhaEmpresa = doc.splitTextToSize('CNPJ: 41.817.517/0001-55  •  Alameda das Tulipas, 405 — Arujá/SP — CEP 07411-415  •  Tel: (11) 95640-4050', 180);
  doc.text(linhaEmpresa, 14, yLogo);
  yLogo += 4.5 * linhaEmpresa.length + 5.5;
  doc.setTextColor(0);

  if (cliente?.cnpj) {

// ======================= BLOCOS DE CONFIRMAÇÃO / ASSINATURA (PDF) =======================
// Padrão único usado por TODO PDF que tenha assinatura. Cada documento só monta a lista de
// células (blocos de confirmação e, se houver, o registro fotográfico) e chama
// desenharGradeConfirmacoes — o layout (colunas, alinhamento, área de assinatura, quebra de
// página) é sempre o mesmo. Localização no PDF: somente o IP (sem mapa/coordenadas).
const PDF_CONF = {
  colunas: 2,
  gapColunas: 10,
  gapLinhas: 10,
  limiteY: 284,
  // Título do bloco
  tituloParaCampos: 8,
  // Campo: rótulo pequeno em cima, valor embaixo
  rotuloParaValor: 4.6,
  alturaLinhaValor: 4.3,
  entreCampos: 5.6,
  // Área de assinatura (mesma altura em todos os blocos)
  camposParaAssinatura: 6,
  larguraAreaAssinatura: 62,
  alturaImagemAssinatura: 22,
  imagemParaLinha: 1.5,
  linhaParaRotulo: 4,
  alturaAreaAssinatura: 22 + 1.5 + 4 + 1.5
};
// Data/hora de registro (Timestamp do Firestore, ISO ou Date) no padrão do PDF.
function formatarDataHoraRegistro(v) {
  if (!v) return '-';
  const d = v.toDate ? v.toDate() : new Date(v);
  if (isNaN(d.getTime())) return '-';
  return formatarDataHoraPdf(d.toLocaleString('pt-BR'));
}
// "25/09/2026, 10:43:08" -> "25/09/2026 – 10:43:08"
function formatarDataHoraPdf(texto) {
  if (!texto) return '-';
  return String(texto).replace(/,\s*/, ' – ');
}
// Campos padrão de quem assinou — iguais em todos os documentos.
function camposAssinante(assinatura, rotuloResponsavel) {
  return [{
    rotulo: rotuloResponsavel,
    valor: assinatura?.nome
  }, {
    rotulo: 'CPF',
    valor: assinatura?.cpf ? formatarCPF(assinatura.cpf) : '-'
  }, {
    rotulo: 'Data e hora',
    valor: formatarDataHoraPdf(assinatura?.dataTexto)
  }, {
    rotulo: 'IP da localização',
    valor: assinatura?.ip || 'Não registrado'
  }];
}
function _linhasCampo(doc, valor, largura) {
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  return doc.splitTextToSize(String(valor || '-'), largura);
}
function _alturaCampos(doc, campos, largura) {
  let h = 0;
  campos.forEach((c, i) => {
    if (c.separador) {
      h += 4;
      return;
    }
    const n = _linhasCampo(doc, c.valor, largura).length;
    h += PDF_CONF.rotuloParaValor + (n - 1) * PDF_CONF.alturaLinhaValor;
    if (i < campos.length - 1) h += PDF_CONF.entreCampos;
  });
  return h;
}
function _desenharCampos(doc, campos, x, y, largura) {
  campos.forEach((c, i) => {
    if (c.separador) {
      doc.setDrawColor(230, 223, 221);
      doc.setLineWidth(0.25);
      doc.line(x, y - 1.2, x + largura, y - 1.2);
      y += 4;
      return;
    }
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.6);
    doc.setTextColor(140, 130, 128);
    doc.text(String(c.rotulo).toUpperCase(), x, y);
    const linhas = _linhasCampo(doc, c.valor, largura);
    doc.setTextColor(40, 34, 33);
    doc.text(linhas, x, y + PDF_CONF.rotuloParaValor, {
      lineHeightFactor: PDF_CONF.alturaLinhaValor / (9.5 * 0.3528)
    });
    y += PDF_CONF.rotuloParaValor + (linhas.length - 1) * PDF_CONF.alturaLinhaValor;
    if (i < campos.length - 1) y += PDF_CONF.entreCampos;
  });
}
function _desenharAreaAssinatura(doc, imagem, x, y, largura) {
  const w = Math.min(PDF_CONF.larguraAreaAssinatura, largura);
  const hImg = PDF_CONF.alturaImagemAssinatura;
  if (imagem) {
    // Imagem gerada em 340x160 — mantém a proporção, centralizada sobre a linha.
    const wImg = Math.min(w, hImg * 340 / 160);
    try {
      doc.addImage(imagem, 'PNG', x + (w - wImg) / 2, y, wImg, hImg);
    } catch (err) {}
  }
  const yLinha = y + hImg + PDF_CONF.imagemParaLinha;
  doc.setDrawColor(120, 110, 108);
  doc.setLineWidth(0.3);
  doc.line(x, yLinha, x + w, yLinha);
  // Sem repetir o nome embaixo da linha: ele já aparece nos campos do bloco.
  const yTexto = yLinha + PDF_CONF.linhaParaRotulo;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.2);
  doc.setTextColor(140, 130, 128);
  doc.text('Assinatura', x + w / 2, yTexto, {
    align: 'center'
  });
  doc.setTextColor(40, 34, 33);
}
// Célula de confirmação: { tipo:'confirmacao', titulo, campos:[{rotulo, valor}|{separador:true}], imagem }
function celulaConfirmacao(titulo, campos, imagem) {
  return {
    tipo: 'confirmacao',
    titulo,
    campos,
    imagem
  };
}
// Célula de registro fotográfico. `registros` tem a mesma posição de `fotos`:
// [{ registradoPor, dataRegistro }] — quem (usuário da empresa) registrou cada foto e quando.
// Foto sem registro (entradas antigas) mostra "Registro não disponível".
function celulaFoto(titulo, legenda, fotos, registros) {
  const lista = (fotos || []).map((f, i) => ({
    foto: f,
    registro: (registros || [])[i] || null
  })).filter(x => x.foto).slice(0, 3);
  return {
    tipo: 'foto',
    titulo,
    legenda,
    fotos: lista.map(x => x.foto),
    registros: lista.map(x => x.registro)
  };
}
function _legendaFoto(registro) {
  if (!registro || !registro.registradoPor && !registro.dataRegistro) return ['Registro não disponível'];
  return [`Registrado por: ${registro.registradoPor || '-'}`, `Data e hora: ${formatarDataHoraRegistro(registro.dataRegistro)}`];
}
function _medidasFoto(celula, largura) {
  const gap = 4,
    n = celula.fotos.length;
  const tamanho = n <= 1 ? Math.min(58, largura) : (largura - gap * (n - 1)) / n;
  return {
    gap,
    tamanho
  };
}
function _linhasLegendaFoto(doc, registro, tamanho) {
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6.8);
  return _legendaFoto(registro).flatMap(l => doc.splitTextToSize(l, tamanho));
}
function _alturaLegendas(doc, celula, largura) {
  const {
    tamanho
  } = _medidasFoto(celula, largura);
  const maxLinhas = Math.max(0, ...celula.registros.map(r => _linhasLegendaFoto(doc, r, tamanho).length));
  return maxLinhas ? 3.2 + maxLinhas * 2.9 : 0;
}
function _alturaCelula(doc, celula, largura, alturaCamposLinha) {
  if (celula.tipo === 'foto') {
    const {
      tamanho
    } = _medidasFoto(celula, largura);
    return PDF_CONF.tituloParaCampos + 3 + tamanho + _alturaLegendas(doc, celula, largura);
  }
  return PDF_CONF.tituloParaCampos + alturaCamposLinha + PDF_CONF.camposParaAssinatura + PDF_CONF.alturaAreaAssinatura;
}
// Título do bloco: mesmo estilo dos demais títulos de seção, reduzindo a fonte
// só se ele não couber na largura da coluna.
function _desenharTituloCelula(doc, texto, x, y, largura) {
  doc.setFont('helvetica', 'bold');
  let tam = 10;
  doc.setFontSize(tam);
  while (tam > 7.5 && doc.getTextWidth(texto.toUpperCase()) > largura) {
    tam -= 0.25;
    doc.setFontSize(tam);
  }
  doc.setTextColor(69, 59, 60);
  doc.text(texto.toUpperCase(), x, y);
  doc.setDrawColor(233, 115, 7);
  doc.setLineWidth(0.4);
  doc.line(x, y + 1.8, x + 14, y + 1.8);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(0, 0, 0);
}
function _desenharCelula(doc, celula, x, y, largura, alturaCamposLinha) {
  _desenharTituloCelula(doc, celula.titulo, x, y, largura);
  let yy = y + PDF_CONF.tituloParaCampos;
  if (celula.tipo === 'foto') {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(130, 120, 118);
    if (celula.legenda) doc.text(doc.splitTextToSize(celula.legenda, largura)[0], x, yy - 1.5);
    yy += 3;
    const {
      gap,
      tamanho
    } = _medidasFoto(celula, largura);
    let fx = x;
    celula.fotos.forEach((foto, i) => {
      try {
        doc.addImage(foto, 'JPEG', fx, yy, tamanho, tamanho);
      } catch (err) {
        try {
          doc.addImage(foto, 'PNG', fx, yy, tamanho, tamanho);
        } catch (err2) {}
      }
      // Identificação de quem registrou ESTA foto, logo abaixo dela.
      const linhas = _linhasLegendaFoto(doc, celula.registros[i], tamanho);
      doc.setTextColor(110, 100, 98);
      linhas.forEach((l, k) => doc.text(l, fx, yy + tamanho + 3.2 + k * 2.9));
      fx += tamanho + gap;
    });
    doc.setTextColor(40, 34, 33);
    return;
  }
  _desenharCampos(doc, celula.campos, x, yy, largura);
  // A área de assinatura fica na MESMA altura em todos os blocos da linha.
  _desenharAreaAssinatura(doc, celula.imagem, x, yy + alturaCamposLinha + PDF_CONF.camposParaAssinatura, largura);
}
// Desenha as células em colunas de mesma largura, linhas alinhadas pelo topo e
// quebra de página automática (uma linha nunca é cortada entre páginas).
async function desenharGradeConfirmacoes(doc, celulas, {
  y,
  margemX,
  larguraUtil,
  novaPagina
}) {
  const cols = PDF_CONF.colunas;
  const largura = (larguraUtil - PDF_CONF.gapColunas * (cols - 1)) / cols;
  for (let i = 0; i < celulas.length; i += cols) {
    const linha = celulas.slice(i, i + cols);
    const alturaCamposLinha = Math.max(0, ...linha.filter(c => c.tipo === 'confirmacao').map(c => _alturaCampos(doc, c.campos, largura)));
    const alturaLinha = Math.max(...linha.map(c => _alturaCelula(doc, c, largura, alturaCamposLinha)));
    if (y + alturaLinha > PDF_CONF.limiteY) y = await novaPagina();
    linha.forEach((c, j) => _desenharCelula(doc, c, margemX + j * (largura + PDF_CONF.gapColunas), y, largura, alturaCamposLinha));
    y += alturaLinha + PDF_CONF.gapLinhas;
  }
  return y;
}
