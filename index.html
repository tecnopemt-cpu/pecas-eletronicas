    const reader = new FileReader();
    reader.onload = e => {

      img.onload = () => {

function calcularComissoesOrcamento(total, funcionarios) {

    visitados.add(func.id);
    const percentual = Number(func.percentualComissao) || 0;
    let base;
    if (func.comissaoBaseId) {
      const funcBase = funcionarios.find(fu => fu.id === func.comissaoBaseId);
      base = valorDe(funcBase, visitados);
    } else {
      base = total;
    }
    const valor = base * percentual / 100;
    cache[func.id] = valor;
    return valor;
  }
  return funcionarios.filter(f => f.ativo !== false && Number(f.percentualComissao) > 0).map(f => ({
    funcionarioId: f.id,
    valor: valorDe(f, new Set())
  })).filter(c => c.valor > 0);
}

function validarCPF(cpf) {

  if (resto !== Number(d[9])) return false;
  soma = 0;
  for (let i = 0; i < 10; i++) soma += Number(d[i]) * (11 - i);

}

function carregarImagemDataUrl(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      try {
        resolve(canvas.toDataURL('image/png'));
      } catch (err) {
        reject(err);
      }
    };

  });
}
async function coletarLocalizacao() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => resolve({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude
    }), () => resolve(null), {
      timeout: 6000
    });
  });
}
