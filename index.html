    --verde:#2f9e5b;
    --vermelho:#c0392b;
    --texto:#e8edf1;
    --texto-fraco:#93a6b5;
    --fundo:#0e1a26;
    --card:#16242f;
    --input-bg:#0e1a26;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;background:var(--input-bg);border:1px solid var(--azul-borda);color:var(--texto);border-radius:6px;padding:9px 10px;font-size:14px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--laranja);border-color:var(--laranja);}
  label{font-size:12.5px;color:var(--texto-fraco);display:block;margin-bottom:4px;margin-top:10px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--texto-fraco);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--azul-borda);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #1f313f;vertical-align:middle;}
  tr:hover td{background:#182633;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--laranja);color:#fff;border:none;padding:9px 14px;border-radius:6px;font-size:13.5px;font-weight:600;}
  .btn:hover{background:var(--laranja-escuro);}
  .btn.secundario{background:var(--azul-borda);}
  .btn.secundario:hover{background:#3a5670;}
  .btn.perigo{background:var(--vermelho);}
  .btn.verde{background:var(--verde);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.pequeno{padding:6px 10px;font-size:12.5px;}
  .card{background:var(--card);border:1px solid var(--azul-borda);border-radius:10px;padding:18px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.estoque{background:#2c4257;color:#bcd2e3;}
  .badge.conserto{background:#5a4415;color:#f2c353;}
  .badge.consertada{background:#173d29;color:#5fd88f;}
  .badge.entregue{background:#1d3a26;color:#8fd6a8;}
  .badge.pendente{background:#5a4415;color:#f2c353;}
  .badge.aprovado{background:#173d29;color:#5fd88f;}
  .badge.recusado{background:#4a1f1c;color:#e88f85;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--azul-borda);border-radius:6px;}
  .modal-fundo{position:fixed;inset:0;background:rgba(3,8,13,.65);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto;}
  .modal{background:var(--card);border:1px solid var(--azul-borda);border-radius:12px;padding:22px;width:100%;max-width:560px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}
  .foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--azul-borda);}
